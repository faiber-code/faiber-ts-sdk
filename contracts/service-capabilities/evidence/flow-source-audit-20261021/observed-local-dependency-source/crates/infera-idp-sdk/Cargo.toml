[package]
name = "infera-idp-sdk"
version = "0.1.0"
edition = "2021"
description = "Infera IDP gateway middleware, ACL export, and HTTP client"
license = "MIT"
repository = "https://hamgit.ir/faiber/faiber-sdk"
documentation = "https://docs.rs/infera-idp-sdk"
readme = "README.md"
publish = false

[features]
default = ["dev-fallback"]
dev-fallback = []
access-token = []
internal-guard = []

[dependencies]
axum = "0.8.4"
inventory = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
