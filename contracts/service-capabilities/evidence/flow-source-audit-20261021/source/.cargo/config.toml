lint = "clippy --workspace -- -D warnings"
fmt = "fmt --all"

[patch."https://hamgit.ir/faiber/faiber-sdk.git"]
infera-idp-sdk = { path = "../faiber-sdk/crates/infera-idp-sdk" }
